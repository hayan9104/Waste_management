<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15803d" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Safaai Sarathi — AI-verified civic waste management. Report, track and resolve with live vehicle tracking and predictive hotspots."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Safaai Sarathi</title>
    <script>
      // Apply the saved theme before first paint so there is no flash.
      (function () {
        try {
          // Light is the default on first visit, regardless of the device's
          // system theme — dark only applies once the user picks it themselves.
          if (localStorage.getItem('ss_theme') === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
