name: Keep Render Servers Awake

# Render's free tier stops an instance after 15 minutes with no traffic, and a
# cold start takes ~50 seconds. During that window the site looks broken: the
# navbar and layout render instantly from the static bundle, while every panel
# that needs data (login demo accounts, the AI assistant, maps, queues) sits
# empty waiting on the API. These pings keep the instances warm.

on:
  schedule:
    # Every 10 minutes, to stay inside Render's 15-minute idle window.
    # GitHub delays scheduled runs under load, so this is a best-effort guard,
    # not a guarantee — see the note in the README about cold starts.
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Python Vision API
        # Retries absorb a transient blip; a real outage still fails the step
        # so it shows up instead of being swallowed.
        run: curl -sSf --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors https://safaai-vision-api.onrender.com/ > /dev/null

      - name: Ping Node.js Backend API
        # Must match the deployed service and a route that actually exists:
        # the previous value (safaai-api.onrender.com/api/public/health) was a
        # placeholder host that 404s, so the API was never kept awake at all.
        run: curl -sSf --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors https://safaaisarathi2-0.onrender.com/api/health > /dev/null
